buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath "org.flywaydb:flyway-mysql:11.17.0"
		classpath "com.smartnews:jpa-entity-generator:0.99.9"
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0' //spotless
	id("org.flywaydb.flyway") version "11.17.0"
}

apply plugin: com.smartnews.jpa_entity_generator.gradle.EntityGenPlugin
entityGen {
	configPath = 'src/main/resources/entityGenConfig.yml'
}
bootJar {
	archiveFileName = "edu-vibe.jar"
}

group = 'com.tongquan'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// Spotless config
spotless {
	java {
		// Định nghĩa các tệp tin sẽ được áp dụng định dạng
		target 'src/main/java/**/*.java', 'src/test/java/**/*.java'

		// Sử dụng chuẩn Google Java Format (bản 1.17.0 chạy tốt trên Java 17)
		googleJavaFormat('1.17.0')

		// Tự động xóa các import thừa không sử dụng
		removeUnusedImports()

		// Tự động sắp xếp lại thứ tự các câu lệnh import
		importOrder()
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-elasticsearch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

flyway {
	url = 'jdbc:mysql://localhost:3307/nook'
	user = 'quan123'
	password = 'quan123'
	locations = ['filesystem:src/main/resources/db/migration']
	cleanDisabled = false
}


tasks.named('test') {
	useJUnitPlatform()
}
