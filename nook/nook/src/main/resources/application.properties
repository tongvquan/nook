spring.application.name=nook

server.port=${APP_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nook}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:quan123}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:quan123}
spring.datasource.show-sql=${SPRING_DATASOURCE_SHOW_SQL:true}

spring.flyway.locations=classpath:/db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management.endpoint.health.show-details=always
