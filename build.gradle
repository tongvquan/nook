buildscript {
	repositories {
		mavenCentral()
	}
	dependencies {
		classpath "org.flywaydb:flyway-database-postgresql:11.17.0"
		classpath "org.postgresql:postgresql:42.7.13" //use for entity gen
		classpath "com.smartnews:jpa-entity-generator:0.99.9"
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.9.0'
	id("org.flywaydb.flyway") version "11.17.0"
	id 'jacoco'
	id 'org.sonarqube' version '7.3.1.8318'
}

apply plugin: com.smartnews.jpa_entity_generator.gradle.EntityGenPlugin
entityGen {
	configPath = 'src/main/resources/entityGenConfig.yml'
}
bootJar {
	archiveFileName = "nook.jar"
}

group = 'com.tongquan'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// Spotless config
spotless {
	java {
		target 'src/main/java/**/*.java', 'src/test/java/**/*.java'

		expandWildcardImports()
		removeUnusedImports()
		importOrder()

		// Format type
		palantirJavaFormat()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0")
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation("io.jsonwebtoken:jjwt:0.13.0")
	implementation("org.springframework.boot:spring-boot-starter-oauth2-resource-server")

	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-elasticsearch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

flyway {
	url = System.getenv('FLYWAY_URL') ?: System.getenv('SPRING_DATASOURCE_URL') ?: 'jdbc:postgresql://localhost:5432/nook'
	user = System.getenv('FLYWAY_USER') ?: System.getenv('SPRING_DATASOURCE_USERNAME') ?: 'quan123'
	password = System.getenv('FLYWAY_PASSWORD') ?: System.getenv('SPRING_DATASOURCE_PASSWORD') ?: 'quan123'
	locations = ['filesystem:src/main/resources/db/migration']
	cleanDisabled = false
}


tasks.named('test') {
	useJUnitPlatform()
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// Đọc SONAR_TOKEN từ biến môi trường hoặc file .env
def localEnv = new Properties()
def localEnvFile = rootProject.file('.env')

if (localEnvFile.exists()) {
	localEnvFile.withInputStream {
		localEnv.load(it)
	}
}

def sonarToken =
		System.getenv('SONAR_TOKEN')
				?: localEnv.getProperty('SONAR_TOKEN')

sonar {
	properties {
		property 'sonar.projectKey', 'nook'
		property 'sonar.projectName', 'Nook'
		property 'sonar.host.url', 'http://localhost:9000'

		if (sonarToken) {
			property 'sonar.token', sonarToken
		}

		property(
				'sonar.coverage.jacoco.xmlReportPaths',
				layout.buildDirectory
						.file('reports/jacoco/test/jacocoTestReport.xml')
						.get()
						.asFile
						.absolutePath
		)
	}
}

tasks.named('sonar') {
	dependsOn jacocoTestReport

	doFirst {
		if (!sonarToken) {
			throw new GradleException(
					'Không tìm thấy SONAR_TOKEN trong biến môi trường hoặc file .env'
			)
		}
	}
}